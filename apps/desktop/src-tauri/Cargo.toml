[package]
name = "ihatepdf-desktop"
version = "0.1.0"
description = "iHatePDF Desktop"
authors = ["iHatePDF"]
edition = "2021"

[lib]
name = "ihatepdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
open = "5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
